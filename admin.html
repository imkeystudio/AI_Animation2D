<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Animation Admin</title>
<style>
:root{--bg:#14171c;--panel:#1e2228;--line:#2c323a;--tx:#e6e8eb;--mut:#8a93a1;--acc:#2f7de1;--ok:#5cc98a;--bad:#ff8b7a;--c2:#f0b43c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:16px;margin:0;font-weight:600}header .sp{flex:1}header .who{color:var(--mut);font-size:13px}
button{height:32px;border-radius:6px;border:1px solid #2f3640;background:#272c34;color:var(--tx);font:inherit;padding:0 12px;cursor:pointer}button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
input,select{height:32px;border-radius:6px;border:1px solid #2f3640;background:var(--bg);color:var(--tx);padding:0 10px;font:inherit}
main{padding:16px 20px;max-width:1400px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}.tile .k{color:var(--mut);font-size:12px}.tile .v{font-size:24px;font-weight:600;margin-top:4px}
.tile .v.live:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:middle;box-shadow:0 0 0 3px rgba(92,201,138,.2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.card h2{font-size:14px;margin:0 0 10px;font-weight:600}
.card .muted,.muted{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;cursor:pointer;user-select:none}th.s:after{content:" ▾"}th.s.up:after{content:" ▴"}tbody tr{cursor:pointer}tbody tr:hover{background:#242930}
.scroll{overflow:auto;max-height:520px}.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-bottom:6px}.legend i{display:inline-block;width:10px;height:3px;margin-right:5px;vertical-align:middle}
svg text{fill:var(--mut);font-size:11px}
#gate{display:flex;align-items:center;justify-content:center;min-height:80vh}#gate .card{width:min(360px,calc(100vw - 32px))}#gate input,#gate button{width:100%;margin-top:8px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ok)}
#detail{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow:auto;display:none;z-index:10}
.bar{height:6px;background:#2a3038;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
</style>
</head>
<body>
<header><h1>AI Animation · Admin</h1><span class="sp"></span><span class="who" id="who"></span><button id="out" style="display:none">Sign out</button></header>
<div id="gate"><div class="card"><h2>Admin sign in</h2><button class="pri" id="gG">Continue with Google</button><input id="gE" type="email" placeholder="Email"><input id="gP" type="password" placeholder="Password"><button id="gIn">Sign in</button><div class="err" id="gErr"></div></div></div>
<main id="app" style="display:none">
  <div class="tiles" id="tiles"></div>
  <div class="grid">
    <div class="card"><h2>Active users</h2><div class="legend"><span><i style="background:var(--acc)"></i>Daily</span><span><i style="background:var(--c2)"></i>Weekly</span><span><i style="background:var(--ok)"></i>Monthly</span></div><div id="chActive"></div></div>
    <div class="card"><h2>New users per day</h2><div id="chNew"></div></div>
  </div>
  <div class="grid">
    <div class="card"><h2>Active now</h2><div class="scroll" style="max-height:260px"><table><thead><tr><th>User</th><th>Version</th><th>Since</th></tr></thead><tbody id="tbNow"></tbody></table></div></div>
    <div class="card"><h2>Speed by version</h2><div class="scroll" style="max-height:260px"><table><thead><tr><th>Version</th><th>Sessions</th><th>Load</th><th>FPS</th><th>Import</th></tr></thead><tbody id="tbPerf"></tbody></table></div></div>
  </div>
  <div class="grid">
    <div class="card"><h2>Imports and exports (30 days)</h2><div id="usage"></div></div>
    <div class="card"><h2>Top errors (30 days)</h2><div class="scroll" style="max-height:260px"><table><thead><tr><th>Count</th><th>Users</th><th>Message</th><th>Last version</th></tr></thead><tbody id="tbErr"></tbody></table></div></div>
  </div>
  <div class="card"><h2>Users</h2><div class="row"><input id="q" placeholder="Search name, email, country" style="width:280px"><span class="muted" id="nUsers"></span></div>
    <div class="scroll"><table><thead><tr id="thU"></tr></thead><tbody id="tbU"></tbody></table></div></div>
</main>
<div id="detail"></div>
<script src="firebase_config.js"></script>
<script>
(async function () {
  const CFG = window.AIA_FIREBASE, $ = id => document.getElementById(id), esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  if (!CFG || !CFG.apiKey) { $("gate").innerHTML = `<div class="card"><h2>Not set up yet</h2><p class="muted">Login and usage data are off. Follow SETUP.md and paste the Firebase web config into firebase_config.js.</p></div>`; return; }
  const SDK = "https://cdn.jsdelivr.net/npm/firebase@10.12.2/", load = s => new Promise((r, j) => { const e = document.createElement("script"); e.src = s; e.onload = r; e.onerror = j; document.head.appendChild(e); });
  for (const m of ["firebase-app-compat.js", "firebase-auth-compat.js", "firebase-firestore-compat.js", "firebase-database-compat.js"]) await load(SDK + m);
  const fb = firebase; fb.initializeApp(CFG); const auth = fb.auth(), db = fb.firestore(), rtdb = CFG.databaseURL ? fb.database() : null;
  if (window.AIA_FIREBASE_EMULATOR) { auth.useEmulator(AIA_FIREBASE_EMULATOR.auth); db.useEmulator(...AIA_FIREBASE_EMULATOR.firestore); if (rtdb) rtdb.useEmulator(...AIA_FIREBASE_EMULATOR.database); }
  const err = t => $("gErr").textContent = t;
  $("gG").onclick = () => auth.signInWithPopup(new fb.auth.GoogleAuthProvider()).catch(e => err(e.message));
  $("gIn").onclick = () => auth.signInWithEmailAndPassword($("gE").value.trim(), $("gP").value).catch(e => err(e.message));
  $("out").onclick = () => auth.signOut();
  auth.onAuthStateChanged(async u => {
    $("out").style.display = u ? "" : "none"; $("who").textContent = u ? (u.email || "") : "";
    if (!u) { $("gate").style.display = "flex"; $("app").style.display = "none"; return; }
    let ok = false; try { ok = (await db.collection("admins").doc((u.email || "").toLowerCase()).get()).exists; } catch (e) {}
    if (!ok) { $("gate").style.display = "flex"; $("app").style.display = "none"; err("This account is not an admin. Ask an admin to add your email to the admins list."); return; }
    $("gate").style.display = "none"; $("app").style.display = "block"; start();
  });

  const DAY = 864e5, dayKey = d => new Date(d).toISOString().slice(0, 10), ts = v => v && v.toDate ? v.toDate().getTime() : (typeof v === "number" ? v : 0);
  const ago = t => { if (!t) return "—"; const s = (Date.now() - t) / 1000; return s < 60 ? "now" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; };
  const dur = s => { s = Math.round(s || 0); return s < 60 ? s + " s" : s < 3600 ? Math.round(s / 60) + " min" : (s / 3600).toFixed(1) + " h"; };
  let USERS = [], SESS = [], EVS = [], NOW = {};
  async function start() {
    const since90 = fb.firestore.Timestamp.fromMillis(Date.now() - 90 * DAY), since30 = fb.firestore.Timestamp.fromMillis(Date.now() - 30 * DAY);
    const [u, s, e] = await Promise.all([db.collection("users").get(), db.collection("sessions").where("start", ">=", since90).get(), db.collection("events").where("t", ">=", since30).limit(20000).get()]);
    USERS = u.docs.map(d => d.data()); SESS = s.docs.map(d => Object.assign({ id: d.id }, d.data())); EVS = e.docs.map(d => d.data());
    if (rtdb) rtdb.ref("status").on("value", snap => { NOW = snap.val() || {}; renderNow(); renderTiles(); });
    renderTiles(); renderActive(); renderNew(); renderPerf(); renderUsage(); renderErr(); renderUsers();
  }
  const online = () => Object.entries(NOW).filter(([, v]) => v && v.state === "online");
  function renderTiles() {
    const today = dayKey(Date.now()), dau = new Set(SESS.filter(x => dayKey(ts(x.start)) === today).map(x => x.uid)).size;
    const mau = new Set(SESS.filter(x => ts(x.start) > Date.now() - 30 * DAY).map(x => x.uid)).size, s30 = SESS.filter(x => ts(x.start) > Date.now() - 30 * DAY);
    const avg = s30.length ? s30.reduce((a, x) => a + (x.durationS || 0), 0) / s30.length : 0;
    const T = [["Active now", online().length, "live"], ["Users", USERS.length], ["Active today", dau], ["Active this month", mau], ["Sessions today", SESS.filter(x => dayKey(ts(x.start)) === today).length], ["Avg session", dur(avg)]];
    $("tiles").innerHTML = T.map(([k, v, c]) => `<div class="tile"><div class="k">${k}</div><div class="v ${c || ""}">${v}</div></div>`).join("");
  }
  function lineChart(el, days, series, max) {
    const W = el.clientWidth || 600, H = 200, L = 34, B = 22, n = days.length, mx = Math.max(1, max || Math.max(...series.flatMap(s => s.v)));
    const X = i => L + (W - L - 8) * (n <= 1 ? 0 : i / (n - 1)), Y = v => 8 + (H - B - 8) * (1 - v / mx);
    let g = `<svg width="${W}" height="${H}">`; for (let k = 0; k <= 4; k++) { const v = Math.round(mx * k / 4), y = Y(v); g += `<line x1="${L}" x2="${W - 8}" y1="${y}" y2="${y}" stroke="#2c323a"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${v}</text>`; }
    days.forEach((d, i) => { if (i % Math.ceil(n / 6) === 0 || i === n - 1) g += `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === n - 1 ? "end" : i === 0 ? "start" : "middle"}">${d.slice(5)}</text>`; });
    for (const s of series) { if (s.bars) { const bw = Math.max(2, (W - L - 8) / n - 3); s.v.forEach((v, i) => { g += `<rect x="${X(i) - bw / 2}" y="${Y(v)}" width="${bw}" height="${H - B - Y(v)}" fill="${s.c}" rx="2"><title>${days[i]}: ${v}</title></rect>`; }); }
      else g += `<polyline fill="none" stroke="${s.c}" stroke-width="2" points="${s.v.map((v, i) => X(i) + "," + Y(v)).join(" ")}"/>`; }
    el.innerHTML = g + "</svg>";
  }
  function lastDays(n) { const out = []; for (let i = n - 1; i >= 0; i--) out.push(dayKey(Date.now() - i * DAY)); return out; }
  function renderActive() {
    const days = lastDays(30), by = new Map(); for (const s of SESS) { const k = dayKey(ts(s.start)); (by.get(k) || by.set(k, new Set()).get(k)).add(s.uid); }
    const win = (i, w) => { const u = new Set(); for (let j = Math.max(0, i - w + 1); j <= i; j++) for (const x of by.get(days[j]) || []) u.add(x); return u.size; };
    // weekly / monthly need days before the window: include them from the 90 days loaded
    const all = lastDays(90), idx = all.length - 30, win2 = (i, w) => { const u = new Set(); for (let j = Math.max(0, idx + i - w + 1); j <= idx + i; j++) for (const x of by.get(all[j]) || []) u.add(x); return u.size; };
    lineChart($("chActive"), days, [{ c: "var(--acc)", v: days.map((_, i) => win(i, 1)) }, { c: "var(--c2)", v: days.map((_, i) => win2(i, 7)) }, { c: "var(--ok)", v: days.map((_, i) => win2(i, 30)) }]);
  }
  function renderNew() { const days = lastDays(30), c = new Map(); for (const u of USERS) { const k = dayKey(ts(u.firstSeen) || 0); c.set(k, (c.get(k) || 0) + 1); } lineChart($("chNew"), days, [{ c: "var(--acc)", bars: true, v: days.map(d => c.get(d) || 0) }]); }
  function renderNow() { const rows = online().sort((a, b) => (b[1].last || 0) - (a[1].last || 0)); $("tbNow").innerHTML = rows.length ? rows.map(([uid, v]) => `<tr data-u="${esc(uid)}"><td><span class="dot"></span>${esc(v.name || v.email || uid)}<div class="muted">${esc(v.email || "")}</div></td><td>${esc(v.version || "")}</td><td>${ago(v.last)}</td></tr>`).join("") : `<tr><td class="muted" colspan="3">Nobody right now.</td></tr>`; wireRows($("tbNow")); }
  function renderPerf() {
    const by = new Map(); const g = v => by.get(v) || by.set(v, { n: 0, load: [], fps: [], imp: [] }).get(v);
    for (const s of SESS) { const r = g(s.version || "?"); r.n++; if (s.loadMs) r.load.push(s.loadMs); if (s.fpsAvg) r.fps.push(s.fpsAvg); }
    for (const e of EVS) if (e.type === "import" && e.ms) g(e.version || "?").imp.push(e.ms);
    const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null, ms = v => v == null ? "—" : v < 1000 ? Math.round(v) + " ms" : (v / 1000).toFixed(1) + " s";
    $("tbPerf").innerHTML = [...by.entries()].sort((a, b) => b[0].localeCompare(a[0], undefined, { numeric: true })).map(([v, r]) => `<tr><td>${esc(v)}</td><td>${r.n}</td><td>${ms(avg(r.load))}</td><td>${avg(r.fps) == null ? "—" : avg(r.fps).toFixed(1)}</td><td>${ms(avg(r.imp))}</td></tr>`).join("") || `<tr><td class="muted" colspan="5">No data yet.</td></tr>`;
  }
  function renderUsage() {
    const c = {}; for (const e of EVS) { const k = e.type === "export" ? "Export " + (e.format || "") : e.type === "import" ? "Import" : e.type === "save_spine" ? "Save .spine" : null; if (k) c[k] = (c[k] || 0) + 1; }
    const mx = Math.max(1, ...Object.values(c)); $("usage").innerHTML = Object.keys(c).length ? Object.entries(c).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<div class="row" style="margin-bottom:6px"><span style="width:130px">${esc(k)}</span><div class="bar" style="flex:1"><i style="width:${n / mx * 100}%"></i></div><b style="width:50px;text-align:right">${n}</b></div>`).join("") : `<p class="muted">No imports or exports yet.</p>`;
  }
  function renderErr() {
    const by = new Map(); for (const e of EVS) if (e.type === "error") { const r = by.get(e.msg) || by.set(e.msg, { n: 0, u: new Set(), v: "" }).get(e.msg); r.n++; r.u.add(e.uid); r.v = e.version || r.v; }
    $("tbErr").innerHTML = [...by.entries()].sort((a, b) => b[1].n - a[1].n).slice(0, 50).map(([m, r]) => `<tr><td>${r.n}</td><td>${r.u.size}</td><td style="white-space:normal">${esc(m)}</td><td>${esc(r.v)}</td></tr>`).join("") || `<tr><td class="muted" colspan="4">No errors. </td></tr>`;
  }
  const COLS = [["name", "Name"], ["email", "Email"], ["country", "Country"], ["lastSeen", "Last seen"], ["firstSeen", "First seen"], ["sessions", "Sessions"], ["totalTimeS", "Total time"], ["device", "Device"], ["version", "Version"]];
  let sortK = "lastSeen", sortUp = false;
  function renderUsers() {
    $("thU").innerHTML = COLS.map(([k, t]) => `<th data-k="${k}" class="${k === sortK ? "s" + (sortUp ? " up" : "") : ""}">${t}</th>`).join("");
    $("thU").querySelectorAll("th").forEach(th => th.onclick = () => { const k = th.dataset.k; if (k === sortK) sortUp = !sortUp; else { sortK = k; sortUp = false; } renderUsers(); });
    const q = $("q").value.trim().toLowerCase(), val = (u, k) => k === "lastSeen" || k === "firstSeen" ? ts(u[k]) : k === "device" ? (u.device ? u.device.os + " " + u.device.browser : "") : (u[k] ?? "");
    const list = USERS.filter(u => !q || [u.name, u.email, u.country].some(x => String(x || "").toLowerCase().includes(q)))
      .sort((a, b) => { const x = val(a, sortK), y = val(b, sortK); const c = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y)); return sortUp ? c : -c; });
    $("nUsers").textContent = list.length + " of " + USERS.length;
    $("tbU").innerHTML = list.map(u => `<tr data-u="${esc(u.uid)}"><td>${NOW[u.uid] && NOW[u.uid].state === "online" ? '<span class="dot"></span>' : ""}${esc(u.name || "—")}</td><td>${esc(u.email)}</td><td>${esc(u.country || "")}</td><td>${ago(ts(u.lastSeen))}</td><td>${ts(u.firstSeen) ? dayKey(ts(u.firstSeen)) : "—"}</td><td>${u.sessions || 0}</td><td>${dur(u.totalTimeS)}</td><td>${esc(val(u, "device"))}</td><td>${esc(u.version || "")}</td></tr>`).join("");
    wireRows($("tbU"));
  }
  $("q").oninput = renderUsers;
  function wireRows(tb) { tb.querySelectorAll("tr[data-u]").forEach(r => r.onclick = () => detail(r.dataset.u)); }
  async function detail(uid) {
    const u = USERS.find(x => x.uid === uid) || { uid }, D = $("detail"); D.style.display = "block";
    const [s, e] = await Promise.all([db.collection("sessions").where("uid", "==", uid).get(), db.collection("events").where("uid", "==", uid).get()]);
    const ss = s.docs.map(d => d.data()).sort((a, b) => ts(b.start) - ts(a.start)), es = e.docs.map(d => d.data()).sort((a, b) => ts(b.t) - ts(a.t));
    D.innerHTML = `<div class="row"><h2 style="margin:0;flex:1">${esc(u.name || u.email || uid)}</h2><button id="dX">Close</button></div>
      <p class="muted">${esc(u.email || "")} · ${esc(u.country || "")} · ${u.device ? esc(u.device.os + " / " + u.device.browser + (u.device.mobile ? " (phone)" : "") + " · " + u.device.screen) : ""}</p>
      <div class="tiles"><div class="tile"><div class="k">Sessions</div><div class="v">${ss.length}</div></div><div class="tile"><div class="k">Total time</div><div class="v">${dur(ss.reduce((a, x) => a + (x.durationS || 0), 0))}</div></div><div class="tile"><div class="k">Events</div><div class="v">${es.length}</div></div></div>
      <h2>Sessions</h2><table><thead><tr><th>Start</th><th>Length</th><th>Version</th><th>Load</th><th>FPS</th></tr></thead><tbody>${ss.slice(0, 100).map(x => `<tr><td>${ts(x.start) ? new Date(ts(x.start)).toLocaleString() : "—"}</td><td>${dur(x.durationS)}</td><td>${esc(x.version)}</td><td>${x.loadMs ? x.loadMs + " ms" : "—"}</td><td>${x.fpsAvg ?? "—"}</td></tr>`).join("")}</tbody></table>
      <h2 style="margin-top:14px">Events</h2><table><thead><tr><th>When</th><th>Type</th><th>Detail</th></tr></thead><tbody>${es.slice(0, 200).map(x => `<tr><td>${ts(x.t) ? new Date(ts(x.t)).toLocaleString() : "—"}</td><td>${esc(x.type)}</td><td style="white-space:normal">${esc([x.format, x.name, x.ms != null ? x.ms + " ms" : "", x.msg].filter(Boolean).join(" · "))}</td></tr>`).join("")}</tbody></table>`;
    $("dX").onclick = () => D.style.display = "none";
  }
  addEventListener("resize", () => { if ($("app").style.display === "block") { renderActive(); renderNew(); } });
})();
</script>
</body>
</html>
